<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Renew Subscription - Passlite Insights</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; text-align: center; padding-top: 50px; margin: 0; }
        .card { background: white; max-width: 500px; margin: 0 auto; padding: 35px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); border-top: 5px solid #123c69; }
        h2 { color: #123c69; }
        p { color: #475569; line-height: 1.6; font-size: 14px; }
        .btn { display: inline-block; margin-top: 20px; padding: 12px 25px; background-color: #16a34a; color: white; text-decoration: none; border-radius: 5px; font-weight: bold; font-size: 15px; width: 100%; box-sizing: border-box; border: none; cursor: pointer; }
        .btn:hover { background-color: #15803d; }
        .back { display: block; margin-top: 15px; color: #64748b; font-size: 13px; text-decoration: none; font-weight: bold; }
        .back:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Term License Notice</h2>
        <p>Your school portal license for <strong>{{ user.current_term }} ({{ user.academic_session }})</strong> needs to be active to input continuous assessments, manage student records, and generate verified PDF report cards.</p>
        
        <form action="{{ url_for('payment_portal') }}" method="GET">
            <button type="submit" class="btn">Proceed to Term Activation</button>
        </form>
        
        <a href="{{ url_for('select_term') }}" class="back">← Switch Term / Session</a>
    </div>
</body>
</html>
