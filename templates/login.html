<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Passlite Insights Academy</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f5f9;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            color: #1e293b;
        }

        .container {
            width: 100%;
            max-width: 420px;
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            box-sizing: border-box;
            border-top: 4px solid #123c69;
        }

        h1 {
            text-align: center;
            color: #123c69;
            font-size: 20px;
            margin-top: 0;
            margin-bottom: 5px;
            letter-spacing: 0.5px;
        }

        h2 {
            text-align: center;
            color: #64748b;
            font-size: 14px;
            margin-top: 0;
            margin-bottom: 25px;
            font-weight: normal;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            font-size: 13px;
            color: #333;
        }

        input {
            width: 100%;
            padding: 12px 15px;
            margin-bottom: 15px;
            border: 1px solid #ccd1d9;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 14px;
            background: #fafbfc;
            transition: border-color 0.2s;
        }

        input:focus {
            outline: none;
            border-color: #123c69;
            background: white;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 10px;
            background: #123c69;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background: #0b2948;
        }

        .register {
            text-align: center;
            margin-top: 20px;
            font-size: 13px;
            color: #666;
        }

        .register a {
            color: #123c69;
            font-weight: bold;
            text-decoration: none;
        }

        .register a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>PASSLITE INSIGHTS</h1>
    <h2>Portal Login</h2>

    <form method="POST" action="/login">

        <label for="email">Username or Email Address</label>
        <input
            type="text"
            id="email"
            name="email"
            placeholder="Enter your username or email"
            required
        >

        <label for="password">Password</label>
        <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter your password"
            required
        >

        <button type="submit">
            🔐 LOGIN
        </button>

    </form>

    <div class="register">
        Don't have an account? <a href="/register">Create an account</a>
    </div>

</div>

</body>

</html>
