<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - Passlite Insights Academy</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f5f9;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: #1e293b;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            box-sizing: border-box;
            border-top: 4px solid #123c69;
            margin: 20px;
        }

        h1 {
            text-align: center;
            color: #123c69;
            font-size: 20px;
            margin-top: 0;
            margin-bottom: 5px;
            letter-spacing: 0.5px;
        }

        h2 {
            text-align: center;
            color: #64748b;
            font-size: 14px;
            margin-top: 0;
            margin-bottom: 25px;
            font-weight: normal;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
            font-size: 13px;
            color: #333;
        }

        input {
            width: 100%;
            padding: 11px 14px;
            margin-bottom: 15px;
            border: 1px solid #ccd1d9;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 14px;
            background: #fafbfc;
            transition: border-color 0.2s, background 0.2s;
        }

        input:focus {
            outline: none;
            border-color: #123c69;
            background: white;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 10px;
            background: #123c69;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background: #0b2948;
        }

        .login {
            text-align: center;
            margin-top: 20px;
            font-size: 13px;
            color: #666;
        }

        .login a {
            color: #123c69;
            font-weight: bold;
            text-decoration: none;
        }

        .login a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

<div class="container">
    <h1>PASSLITE INSIGHTS</h1>
    <h2>Create Your Account</h2>

    <form method="POST" action="{{ url_for('register') }}">

        <label for="username">Username</label>
        <input
            type="text"
            id="username"
            name="username"
            placeholder="Choose a username"
            required
        >

        <label for="school_name">School Name</label>
        <input
            type="text"
            id="school_name"
            name="school_name"
            placeholder="Enter school name"
            required
        >

        <label for="email">Email Address</label>
        <input
            type="email"
            id="email"
            name="email"
            placeholder="Enter email address"
            required
        >

        <label for="phone">Phone Number</label>
        <input
            type="tel"
            id="phone"
            name="phone"
            placeholder="Enter phone number"
            required
        >

        <label for="password">Password</label>
        <input
            type="password"
            id="password"
            name="password"
            placeholder="Create a password"
            required
        >

        <button type="submit">
            ✨ CREATE ACCOUNT
        </button>

    </form>

    <div class="login">
        Already have an account? <a href="{{ url_for('login') }}">Login here</a>
    </div>

</div>

</body>

</html>
