<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Academic Term - Passlite Portal</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f1f5f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: white;
            padding: 35px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            width: 400px;
            border-top: 5px solid #1e3a8a;
            box-sizing: border-box;
        }
        h2 {
            color: #1e3a8a;
            text-align: center;
            margin-bottom: 8px;
            font-size: 22px;
        }
        .subtitle {
            text-align: center;
            color: #64748b;
            font-size: 13px;
            margin-bottom: 25px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
            color: #334155;
            font-size: 13px;
        }
        select {
            width: 100%;
            padding: 10px;
            margin-bottom: 20px;
            border: 1px solid #cbd5e1;
            border-radius: 4px;
            font-size: 14px;
            background-color: #fff;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            background: #1e3a8a;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background: #172554;
        }
        .footer-links {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
            font-size: 13px;
        }
        .footer-links a {
            color: #475569;
            text-decoration: none;
        }
        .footer-links a:hover {
            text-decoration: underline;
        }
        .footer-note {
            text-align: center;
            margin-top: 15px;
            font-size: 12px;
            color: #94a3b8;
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>Passlite Portal</h2>
        <div class="subtitle">Select your active working term & session</div>
        
        <form action="{{ url_for('select_term') }}" method="POST">
            <label>Academic Session:</label>
            <select name="academic_session" required>
                {% for sess in academic_sessions %}
                    <option value="{{ sess }}" {% if user and user.academic_session == sess %}selected{% elif not user and sess == '2026/2027' %}selected{% endif %}>
                        {{ sess }} Academic Session
                    </option>
                {% endfor %}
            </select>

            <label>Active Term & Assessment:</label>
            <select name="current_term" required>
                <option value="First Term" {% if user and user.current_term == 'First Term' %}selected{% endif %}>First Term</option>
                <option value="Second Term" {% if user and user.current_term == 'Second Term' %}selected{% endif %}>Second Term</option>
                <option value="Third Term" {% if user and user.current_term == 'Third Term' %}selected{% endif %}>Third Term</option>
            </select>

            <button type="submit">Proceed to Dashboard →</button>
        </form>

        <div class="footer-links">
            <a href="{{ url_for('support') }}">Need Help?</a>
            <a href="{{ url_for('logout') }}" style="color: #dc2626;">Log Out</a>
        </div>
        
        <div class="footer-note">Secure School Management Solution</div>
    </div>
</body>
</html>
